name: Deploy rtSurvey Docs to GitHub Pages

on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-en:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-en-${{ hashFiles('**/yarn.lock') }}-${{ hashFiles('pages/**') }}
          restore-keys: nextjs-en-
      - name: Build English
        run: NODE_OPTIONS='--max-old-space-size=6144' yarn build
      - uses: actions/upload-artifact@v4
        with:
          name: out-en
          path: out
          retention-days: 1

  build-locales-1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-loc1-${{ hashFiles('**/yarn.lock') }}-${{ hashFiles('_locales/vi/**', '_locales/fr/**', '_locales/de/**', '_locales/pt/**', '_locales/es/**', '_locales/zh-hans/**', '_locales/ar/**') }}
          restore-keys: nextjs-loc1-
      - name: Build locales batch 1
        run: node scripts/build-split.mjs vi fr de pt es zh-hans ar
      - uses: actions/upload-artifact@v4
        with:
          name: out-locales-1
          path: combined
          retention-days: 1

  build-locales-2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-loc2-${{ hashFiles('**/yarn.lock') }}-${{ hashFiles('_locales/th/**', '_locales/id/**', '_locales/km/**', '_locales/hi/**', '_locales/ru/**', '_locales/zh-hant/**', '_locales/ko/**') }}
          restore-keys: nextjs-loc2-
      - name: Build locales batch 2
        run: node scripts/build-split.mjs th id km hi ru zh-hant ko
      - uses: actions/upload-artifact@v4
        with:
          name: out-locales-2
          path: combined
          retention-days: 1

  build-locales-3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-loc3-${{ hashFiles('**/yarn.lock') }}-${{ hashFiles('_locales/ja/**', '_locales/it/**', '_locales/nl/**', '_locales/tr/**', '_locales/uk/**', '_locales/nb/**', '_locales/da/**') }}
          restore-keys: nextjs-loc3-
      - name: Build locales batch 3
        run: node scripts/build-split.mjs ja it nl tr uk nb da
      - uses: actions/upload-artifact@v4
        with:
          name: out-locales-3
          path: combined
          retention-days: 1

  build-locales-4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-loc4-${{ hashFiles('**/yarn.lock') }}-${{ hashFiles('_locales/sv/**', '_locales/fi/**', '_locales/el/**', '_locales/pl/**', '_locales/cs/**', '_locales/sk/**', '_locales/hu/**') }}
          restore-keys: nextjs-loc4-
      - name: Build locales batch 4
        run: node scripts/build-split.mjs sv fi el pl cs sk hu
      - uses: actions/upload-artifact@v4
        with:
          name: out-locales-4
          path: combined
          retention-days: 1

  build-locales-5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-loc5-${{ hashFiles('**/yarn.lock') }}-${{ hashFiles('_locales/bg/**', '_locales/sr/**', '_locales/sq/**', '_locales/lv/**', '_locales/lt/**', '_locales/te/**', '_locales/pt-br/**') }}
          restore-keys: nextjs-loc5-
      - name: Build locales batch 5
        run: node scripts/build-split.mjs bg sr sq lv lt te pt-br
      - uses: actions/upload-artifact@v4
        with:
          name: out-locales-5
          path: combined
          retention-days: 1

  deploy:
    needs: [build-en, build-locales-1, build-locales-2, build-locales-3, build-locales-4, build-locales-5]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: out-en
          path: out
      - uses: actions/download-artifact@v4
        with:
          name: out-locales-1
          path: combined
      - uses: actions/download-artifact@v4
        with:
          name: out-locales-2
          path: combined
      - uses: actions/download-artifact@v4
        with:
          name: out-locales-3
          path: combined
      - uses: actions/download-artifact@v4
        with:
          name: out-locales-4
          path: combined
      - uses: actions/download-artifact@v4
        with:
          name: out-locales-5
          path: combined
      - name: Merge locale outputs into out/
        run: |
          for dir in combined/*/; do
            loc=$(basename "$dir")
            echo "Merging locale: $loc"
            mkdir -p "out/$loc"
            cp -r "$dir"* "out/$loc/" 2>/dev/null || true
          done
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - id: deployment
        uses: actions/deploy-pages@v4
