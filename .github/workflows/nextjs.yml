name: Deploy rtSurvey Docs to GitHub Pages

on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build English (default locale) — runs on its own to stay within memory limits
  build-en:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - run: yarn install --frozen-lockfile
      # Stash all non-English locale dirs before building
      - name: Stash locale directories
        run: |
          mkdir -p .locale-stash
          for loc in vi fr de pt es zh-hans ar th id km hi ru zh-hant ko ja it nl tr uk nb da sv fi el pl cs sk hu bg sr sq lv lt te pt-br; do
            [ -d "pages/$loc" ] && mv "pages/$loc" ".locale-stash/$loc" || true
          done
      - name: Build English
        run: NODE_OPTIONS='--max-old-space-size=6144' yarn build
      - uses: actions/upload-artifact@v4
        with:
          name: out-en
          path: out
          retention-days: 1

  # Build non-English locales in batches of ~9 languages each
  build-locales-1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Build locales batch 1 (vi fr de pt es zh-hans ar th id)
        run: node scripts/build-split.mjs vi fr de pt es zh-hans ar th id
      - uses: actions/upload-artifact@v4
        with:
          name: out-locales-1
          path: combined
          retention-days: 1

  build-locales-2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Build locales batch 2 (km hi ru zh-hant ko ja it nl tr)
        run: node scripts/build-split.mjs km hi ru zh-hant ko ja it nl tr
      - uses: actions/upload-artifact@v4
        with:
          name: out-locales-2
          path: combined
          retention-days: 1

  build-locales-3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Build locales batch 3 (uk nb da sv fi el pl cs sk hu bg sr sq lv lt te pt-br)
        run: node scripts/build-split.mjs uk nb da sv fi el pl cs sk hu bg sr sq lv lt te pt-br
      - uses: actions/upload-artifact@v4
        with:
          name: out-locales-3
          path: combined
          retention-days: 1

  # Merge all outputs and deploy
  deploy:
    needs: [build-en, build-locales-1, build-locales-2, build-locales-3]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: out-en
          path: out
      - uses: actions/download-artifact@v4
        with:
          name: out-locales-1
          path: combined
      - uses: actions/download-artifact@v4
        with:
          name: out-locales-2
          path: combined
      - uses: actions/download-artifact@v4
        with:
          name: out-locales-3
          path: combined
      - name: Merge locale outputs into out/
        run: |
          for dir in combined/*/; do
            loc=$(basename "$dir")
            echo "Merging locale: $loc"
            mkdir -p "out/$loc"
            cp -r "$dir"* "out/$loc/" 2>/dev/null || true
          done
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - id: deployment
        uses: actions/deploy-pages@v4
