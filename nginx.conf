server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip_static on;

    # Static assets — long cache (English and all locales share the same chunk hashes)
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # All pages — try file, then directory index, then 404
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    error_page 404 /404/index.html;
}
