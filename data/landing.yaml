# Feature Grid
featureGrid:
  enable: true
  weight: 20
  template: feature grid

  title: Everything you need for field data collection
  subtitle: rtSurvey is a complete CAPI platform — from form design to offline collection to real-time analytics.

  items:
    - title: Offline Collection
      icon: wifi_off
      description: Collect data in the field without an internet connection. Forms and submissions sync automatically when connectivity is restored.

    - title: GPS & Geo Tracking
      icon: location_on
      description: Capture GPS coordinates, geoshapes, and geotraces. Map your data geographically to ensure spatial coverage.

    - title: Multi-Language Forms
      icon: translate
      description: Build surveys in multiple languages simultaneously. Respondents see the form in their preferred language.

    - title: XLSForm Compatible
      icon: table_view
      description: Design complex forms with skip logic, calculations, and constraints using the widely adopted XLSForm standard.

    - title: Mobile & Web Apps
      icon: devices
      description: Enumerators can collect data from Android, iOS, or any web browser. One platform, every device.

    - title: Real-Time Analytics
      icon: bar_chart
      description: Monitor fieldwork progress live. Drill down by enumerator, date, or location. Export to CSV, Stata, Power BI, or R.

    - title: Quality Assurance
      icon: verified
      description: Set validation rules, flag outliers, and review submissions before they enter your final dataset.

    - title: Self-Hosted
      icon: dns
      description: Run rtSurvey on your own server with Docker Compose. Full control over your data, network, and infrastructure.

    - title: SSO & Access Control
      icon: lock
      description: Integrate with Keycloak, Active Directory, or any OIDC provider. Manage roles and permissions per project.
